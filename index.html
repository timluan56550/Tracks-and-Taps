<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Track and Taps</title>
        <link rel="stylesheet" href="style.css">
        <!-- dev tools -->
        <script src="https://unpkg.com/eruda"></script>
    <script>eruda.init();</script>
    </head>
    <body>
<div id="everything">

    <div id="tutorial">
        <img id="tutorialImage" src="images/tutorial.png">
    </div>

    <div class="displayBox">
          <div id="gameStats">
            <h2 id="roundDisplay">SWITCHES: 0/10</h2>
            <h2 id="timerDisplay">TIME: 120</h2>
            <h2 id="strikeDisplay">STRIKES:</h2>

        </div>
        <h1> Morse Output:</h1>
        <p id="morseDisplay"></p>
    <div id="inputBox">
        <h2>Reply Morse (Target City):</h2>
        <div id="typingDisplay">
            <div id="cursorMove"></div>
        </div>
        <button id="submitText">SEND TRANSMISSION</button>
        <input type="text" id="morseInput" autofocus/>
        </div>
      
        <div id="cityTrackBox">
            <div class="cityTrack">
                <span class="trackLabel">LEFT</span>
                <h3 id="leftCity">----</h3>
            </div>
             <div class="cityTrack" id="middleTrack">
                <span class="trackLabel">MIDDLE</span>
                <h3 id="middleCity">----</h3>
            </div>
             <div class="cityTrack">
                <span class="trackLabel">RIGHT</span>
                <h3 id="rightCity">----</h3>
            </div>
        </div>
    </div>
    <div id="sidebar">
        <div id="morseBankBox">
        <img id="morseBankImg" src="images/bank.png"/>
        </div>
        <div id="narratorBox">
            <p id="narratorText">DISPATCH ONLINE. AWAITING TRANSMISSION...</p>
        </div>
    </div>
</div>
<!-- <audio id="tutorialAudio" src="audio/music/start.ogg" loop preload="auto"></audio> -->
<audio id="gameAudio" src="audio/music/play.ogg" loop preload="auto"></audio>
<script src="./scripts/morse.js"></script>
<script src="./scripts/game.js"></script>
<script src="./scripts/telegraph.js"></script>

<script src="./scripts/audio.js"></script>


    </body>
</html>
